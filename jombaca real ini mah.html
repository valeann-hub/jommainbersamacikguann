<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOM BACA! ADVENTURE</title>
<style>
:root{--navy:#183b67;--blue:#287bd2;--gold:#ffcf45;--cream:#fff6dc;--green:#4aaf78;--pink:#f28eb2;--shadow:0 8px 0 rgba(28,54,83,.18),0 14px 28px rgba(22,45,70,.18)}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;color:#173452;background:#8bd5f5;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer;border:0}
#app{min-height:100vh;background:linear-gradient(#74c9f5 0%,#c7edff 45%,#83c97d 100%);position:relative;overflow:hidden}
.sky{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,#fff9 0 4px,transparent 5px),radial-gradient(circle at 85% 23%,#fff9 0 5px,transparent 6px);opacity:.8}
.cloud{position:fixed;background:#fff9;border-radius:100px;width:180px;height:45px;filter:blur(1px);pointer-events:none;animation:drift 28s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;width:75px;height:75px;top:-34px;left:28px}.cloud:after{width:55px;height:55px;left:92px;top:-20px}@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(110vw)}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;position:relative;z-index:2}
.brand{font-weight:1000;font-size:clamp(17px,3vw,27px);color:#fff;text-shadow:0 3px 0 #1d5591,0 5px 8px #17456d;letter-spacing:.4px}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff7df;border:3px solid #d69b35;border-radius:30px;padding:7px 13px;font-weight:900;box-shadow:var(--shadow);font-size:14px}
main{position:relative;z-index:1;max-width:1180px;margin:auto;padding:12px 18px 40px}
.panel{background:linear-gradient(145deg,#fffdf2,#ffe7b1);border:5px solid #d99b43;border-radius:25px;box-shadow:var(--shadow);padding:clamp(16px,3vw,28px);position:relative}
.hero{min-height:75vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:18px}
h1{font-size:clamp(35px,6vw,68px);line-height:.98;margin:8px 0;color:#f2a51f;text-shadow:0 4px 0 #9b5719,2px 7px 8px #8d633b}.hero p{font-size:clamp(16px,2vw,20px);font-weight:700;color:#36516a}
.hero-art{min-height:330px;display:flex;align-items:center;justify-content:center;position:relative}
.hero-art svg{width:min(100%,420px);filter:drop-shadow(0 15px 10px #315b4b55)}
.btn{padding:12px 18px;border-radius:16px;background:linear-gradient(#ffdf69,#ffad24);color:#603a12;border:3px solid #bd7924;box-shadow:0 5px 0 #a45e1c,0 8px 15px #73491e33;font-weight:1000;margin:5px;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a45e1c}.btn.blue{background:linear-gradient(#80d5ff,#328ce3);border-color:#2164a3;color:white;box-shadow:0 5px 0 #1e5a91}.btn.green{background:linear-gradient(#9de6a7,#4dbd75);border-color:#28814c;color:#104c2d;box-shadow:0 5px 0 #267244}.btn.red{background:linear-gradient(#ffb5a7,#ef685e);border-color:#b9433b;color:white;box-shadow:0 5px 0 #a83b36}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}.menu-grid .btn{min-height:58px}
.section-title{font-size:clamp(25px,4vw,38px);color:#a85e19;text-shadow:0 2px #fff;margin:0 0 12px}.sub{font-weight:700;color:#4b6274}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:3px solid #e7b45c;border-radius:19px;padding:15px;box-shadow:0 5px 0 #d7a14b;text-align:center}.card h3{margin:8px 0 5px;color:#245e96}.avatar{width:100px;height:100px;margin:auto;display:block}
.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.world{min-height:125px;border-radius:18px;padding:14px;background:linear-gradient(145deg,#c6f0ff,#80d7a1);border:3px solid #fff;box-shadow:0 5px 0 #4c9b82;text-align:left;font-weight:900;color:#184d5c}.world.locked{filter:grayscale(.7);opacity:.65}
.game-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.game-stage{background:linear-gradient(#7ed1f3,#d7f5ff 60%,#74bd70 61%);border:4px solid #fff;border-radius:20px;min-height:280px;padding:15px;position:relative;overflow:hidden}
.playground{height:220px;position:relative;border-bottom:7px solid #4b9a53;background:linear-gradient(transparent 70%,#8acb70 70%);overflow:hidden}
.player{position:absolute;bottom:5px;left:15%;font-size:54px;transition:left .15s,transform .15s;filter:drop-shadow(0 4px 2px #5555)}
.obstacle{position:absolute;bottom:6px;right:20%;font-size:42px}.game-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0}.choice{background:#fff;border:3px solid #8ec5e8;border-radius:15px;padding:14px 8px;font-size:22px;font-weight:1000;color:#245e96;box-shadow:0 4px 0 #79add0}.choice:hover{background:#fff4c8}.choice.correct{background:#b7f1c5;border-color:#44ad68}.choice.wrong{background:#ffd0c8;border-color:#e16a5d}
.feedback{font-weight:900;min-height:28px;color:#246b42;margin:8px 0}.progress{height:14px;background:#d8e4e9;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#68ce8d,#ffcf45);width:0%;transition:width .3s}
.note{background:#fff;border-radius:15px;padding:14px;border:2px dashed #e3ae4b;margin:10px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
input{padding:11px;border:2px solid #b6cbd7;border-radius:12px;width:100%;max-width:300px}.hidden{display:none!important}.small{font-size:13px;color:#5b7182}.map-path{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:18px}.map-node{width:125px;height:115px;border-radius:20px;background:linear-gradient(#fff,#d5f4ff);border:4px solid #d8a34b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 5px 0 #ae782d;cursor:pointer}.map-node span{font-size:36px}.map-node.locked{opacity:.5;filter:grayscale(1)}
footer{text-align:center;padding:15px;color:#31566b;font-size:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center;min-height:auto}.hero-art{min-height:210px}.menu-grid{grid-template-columns:repeat(2,1fr)}.game-layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:15px}main{padding:8px}.hud{width:100%}}

/* Peningkatan pengembaraan 2.5D */
.adventure-wrap{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:14px}
.world-canvas{width:100%;height:auto;display:block;border:4px solid #fff;border-radius:18px;background:#9bdcf4;box-shadow:0 5px 0 #77a8ae;touch-action:none}
.side-panel{background:#fff9e9;border:3px solid #e4b65e;border-radius:18px;padding:14px}
.side-panel h3{margin:4px 0 8px;color:#255d8c}
.control-pad{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.control-pad button{min-width:54px;min-height:48px;font-size:19px;touch-action:none}
.quest-list{display:grid;gap:7px}.quest{background:#fff;border:2px solid #e7c77e;border-radius:12px;padding:8px;font-size:13px;font-weight:800}
.quest.done{background:#d8f6dc;border-color:#6fbd82}
.map-world-card{min-height:150px;position:relative;overflow:hidden;background:linear-gradient(150deg,#b9e9ff,#e9f9d5 65%,#a4d98b);border:3px solid #fff;border-radius:19px;padding:13px;text-align:left;box-shadow:0 5px 0 #7bb18c}
.map-world-card .world-emoji{font-size:42px;display:block}.map-world-card strong{display:block;color:#174f73}.map-world-card small{color:#476879;font-weight:700}
.map-world-card.locked{filter:grayscale(.7);opacity:.7}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;background:#173d61;color:white;border:2px solid #ffda70;border-radius:20px;padding:11px 18px;font-weight:900;box-shadow:0 5px 20px #0003;display:none}
@media(max-width:800px){.adventure-wrap{grid-template-columns:1fr}.side-panel{order:2}.world-canvas{min-height:230px}}


/* V3: kamera bergerak, landskap berlapis dan HUD misi */

.world-canvas{height:auto;aspect-ratio:16/8.3;min-height:260px}
.side-panel{position:relative}
.mission-meter{height:12px;border-radius:20px;background:#e8d7b3;overflow:hidden;margin:8px 0}
.mission-meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#65c981,#b7e66b);transition:width .3s}
.action-hint{background:#e6f5ff;border:2px solid #9acde9;border-radius:12px;padding:9px;font-size:13px;font-weight:800}

.room-scene{min-height:340px;border:4px solid white;border-radius:20px;padding:22px;background:linear-gradient(#bce9fa 0 55%,#d8c18f 55%);position:relative;overflow:hidden}
.room-wall{max-width:760px;margin:10px auto;background:#fff4d8;border:7px solid #bd8750;border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 0 #9b6b45}
.room-shelf{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}

.shop-item{background:#fff;border:3px solid #e7c77e;border-radius:16px;padding:14px;text-align:center}

<body>
<div id="app">
<div class="sky"></div><div class="cloud" style="top:14%;left:5%"></div><div class="cloud" style="top:33%;left:70%;animation-delay:-12s"></div>
<header><div class="brand">✦ JOM BACA! ADVENTURE ✦</div><div class="hud"><div class="pill">⭐ <span id="stars">0</span></div><div class="pill">🍌 <span id="coins">0</span></div><div class="pill">✨ Tahap <span id="level">1</span></div></div></header>
<main id="screen"></main>
<footer>JOM BACA! ADVENTURE · Permainan literasi Bahasa Melayu · Kemajuan disimpan pada peranti ini</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const words=[
 ["ba","ju","baju","👕"],["ba","tu","batu","🪨"],["ba","ta","bata","🧱"],["ba","ca","baca","📖"],["ba","ru","baru","✨"],["ba","gi","bagi","🎁"],["ba","hu","bahu","💪"],["ba","pa","bapa","👨"],["ba","wa","bawa","👜"],
 ["bo","la","bola","⚽"],["bu","ku","buku","📘"],["bu","di","budi","🌟"],
 ["ca","ri","cari","🔎"],["cu","ci","cuci","🫧"],["cu","ka","cuka","🧴"],
 ["da","da","dada","🫀"],["da","du","dadu","🎲"],["da","hi","dahi","🙂"],
 ["gi","gi","gigi","🦷"],["gu","la","gula","🧂"],["gu","li","guli","🔵"],
 ["ha","ri","hari","☀️"],["ha","ti","hati","❤️"],
 ["ja","ri","jari","☝️"],["ja","la","jala","🕸️"],["ja","ga","jaga","🛡️"],["ja","di","jadi","⭐"],
 ["ka","ki","kaki","🦶"],["ka","ca","kaca","🪞"],["ku","da","kuda","🐴"],["ku","ku","kuku","💅"],["ka","ta","kata","💬"],["ka","ri","kari","🍛"],
 ["la","da","lada","🌶️"],["la","gu","lagu","🎵"],["la","ri","lari","🏃"],["la","ju","laju","🚗"],["li","ma","lima","5️⃣"],["lu","pa","lupa","🤔"],["lu","ka","luka","🩹"],
 ["ma","ma","mama","👩"],["ma","ta","mata","👀"],["ma","du","madu","🍯"],["ma","sa","masa","⏰"],["ma","lu","malu","😊"],["ma","ri","mari","👋"],["ma","hu","mahu","🙋"],
 ["me","ja","meja","🪑"],["na","si","nasi","🍚"],["na","ma","nama","🏷️"],["na","ga","naga","🐉"],["pa","di","padi","🌾"],["pa","ha","paha","🍗"],["pa","ku","paku","🔩"],["pa","su","pasu","🪴"],["pa","gi","pagi","🌅"],["pa","pa","papa","👨"],
 ["pi","ta","pita","🎀"],["ra","ja","raja","👑"],["ra","sa","rasa","😋"],["ro","da","roda","🛞"],["ro","ti","roti","🍞"],["ru","sa","rusa","🦌"],["ra","pi","rapi","🧹"],
 ["sa","tu","satu","1️⃣"],["sa","te","sate","🍢"],["sa","ku","saku","👖"],["sa","ma","sama","🤝"],["sa","pu","sapu","🧹"],["sa","ya","saya","🙋"],["si","ku","siku","💪"],["si","ni","sini","📍"],["si","la","sila","🪑"],["su","su","susu","🥛"],["su","ka","suka","😄"],["su","ku","suku","🧩"],
 ["ta","li","tali","🪢"],["ta","hu","tahu","🍽️"],["ta","wa","tawa","😆"],["ti","su","tisu","🧻"],["ti","ga","tiga","3️⃣"],["ti","ba","tiba","🚉"],["ti","ru","tiru","✍️"],["to","pi","topi","🧢"],["to","ko","toga","🎓"]
];
const characterData=[{name:"Ari",role:"Ketua Pengembaraan",color:"#f4b332",desc:"Berani dan suka meneroka.",hair:"#57372a",shirt:"#f4b332"},{name:"Mira",role:"Pencinta Buku",color:"#ee8fb0",desc:"Bijak membaca dan menyusun perkataan.",hair:"#4b302b",shirt:"#e987a9"},{name:"Bimo",role:"Pemerhati Cilik",color:"#67b9df",desc:"Teliti mencari petunjuk.",hair:"#5a3829",shirt:"#398dc5"},{name:"Timo",role:"Pencari Harta",color:"#83bd72",desc:"Gemar mengumpul objek tersembunyi.",hair:"#68462f",shirt:"#5caa70"}];
let data=JSON.parse(localStorage.getItem("jombaca-save")||"null")||{name:"Pengembara Cilik",character:0,stars:0,coins:0,xp:0,done:[],unlocked:1,level:1};
let currentGame="",qIndex=0,correct=0,selected=[],memoryOpen=[],memoryDone=[],playerX=15,moveTimer=null;
function save(){localStorage.setItem("jombaca-save",JSON.stringify(data));$("#stars").textContent=data.stars;$("#coins").textContent=data.coins;$("#level").textContent=data.level}
function award(n=1){data.stars+=n;data.coins+=n*5;data.xp+=n*10;data.level=1+Math.floor(data.xp/100);save()}
function shell(title,body,back="home"){return `<section class="panel"><div class="topline"><h2 class="section-title">${title}</h2><button class="btn" onclick="go('${back}')">↩ Kembali</button></div>${body}</section>`}
function mascot(i=0){let c=characterData[i];return `<svg class="avatar" viewBox="0 0 120 120" aria-label="${c.name}"><ellipse cx="60" cy="111" rx="35" ry="6" fill="#577b63" opacity=".3"/><path d="M29 53 Q25 12 60 12 Q95 12 91 53 L91 82 Q88 108 60 108 Q32 108 29 82Z" fill="#f6c98d" stroke="#9a633c" stroke-width="3"/><path d="M30 47 Q26 7 62 13 Q89 15 91 46 Q75 31 60 35 Q45 33 30 47" fill="${c.hair}"/><circle cx="47" cy="57" r="10" fill="white"/><circle cx="73" cy="57" r="10" fill="white"/><circle cx="49" cy="58" r="5" fill="#553a2d"/><circle cx="71" cy="58" r="5" fill="#553a2d"/><path d="M49 78 Q60 88 72 77" stroke="#a64e42" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M25 91 Q60 78 95 91 L100 115 L20 115Z" fill="${c.shirt}" stroke="#285b80" stroke-width="2"/></svg>`}
function home(){save();$("#screen").innerHTML=`<section class="panel hero"><div><div class="pill">🌈 Selamat datang, ${data.name}!</div><h1>JOM BACA!<br>ADVENTURE</h1><p>Teroka dunia ajaib, kumpul bintang dan kuasai suku kata KV + KV bersama rakan pengembaraan!</p><button class="btn blue" style="font-size:23px;padding:17px 28px" onclick="go('characters')">▶ MULA PERMAINAN</button><button class="btn" onclick="go('map')">🗺 PETA DUNIA</button><div class="menu-grid"><button class="btn" onclick="go('profile')">👤 PROFIL</button><button class="btn" onclick="go('activities')">📚 JOM BACA!</button><button class="btn" onclick="go('collection')">🎒 KOLEKSI</button><button class="btn" onclick="go('shop')">🛍️ KEDAI</button><button class="btn" onclick="go('achievements')">🏆 PENCAPAIAN</button><button class="btn" onclick="go('certificate')">📜 SIJIL</button><button class="btn" onclick="go('settings')">⚙ TETAPAN</button></div></div><div class="hero-art">${mascot(data.character)}<div style="position:absolute;right:2%;top:5%;font-size:70px">🏰</div><div style="position:absolute;left:3%;top:10%;font-size:52px">☁️</div><div style="position:absolute;right:5%;bottom:4%;font-size:55px">🌳</div></div></section>`}
function go(page){({home,characters,map,activities,profile,collection,achievements,certificate,settings,game,explore,shop}[page]||home)()}
function characters(){$("#screen").innerHTML=shell("PILIH WATAK PENGEMBARA",`<p class="sub">Pilih rakan yang akan menemani pengembaraan kamu.</p><div class="cards">${characterData.map((c,i)=>`<div class="card">${mascot(i)}<h3>${c.name}</h3><b>${c.role}</b><p class="small">${c.desc}</p><button class="btn ${data.character===i?'green':'blue'}" onclick="data.character=${i};save();characters()">Pilih watak</button></div>`).join("")}</div><div style="text-align:center;margin-top:18px"><button class="btn green" onclick="go('map')">Teruskan pengembaraan →</button></div>`)}
const worlds=[["🏡","Gru's House","Cari buku petunjuk"],["🌙","Moon World","Kumpul suku kata di bulan"],["🚀","Outer Space","Bina perkataan angkasa"],["🧪","Secret Laboratory","Aktifkan mesin bahasa"],["🏙️","City World","Baca papan tanda"],["🌋","Volcano World","Selesaikan teka-teki"],["🏰","Villain Castle","Misi rahsia KV+KV"],["🐠","Underwater World","Memancing perkataan"],["🌆","Futuristic City","Cabaran membaca"],["🌈","JOM BACA! World","Pusat pembelajaran utama"]];
function map(){$("#screen").innerHTML=shell("PETA DUNIA",`<p class="sub">Selesaikan misi untuk membuka kawasan seterusnya. Dunia pertama tersedia untuk diterokai.</p><div class="world-grid">${worlds.map((w,i)=>`<button class="world ${i>=data.unlocked?'locked':''}" onclick="${i<data.unlocked?`go('explore')`:`lockedWorld()`}"><div style="font-size:35px">${w[0]}</div>${w[1]}<div class="small">${i<data.unlocked?'✓ Boleh diterokai':'🔒 Belum dibuka'}</div></button>`).join("")}</div><div class="note">⭐ Bintang terkumpul: ${data.stars} · Misi selesai: ${data.done.length}</div>`)}
function lockedWorld(){alert("Selesaikan aktiviti membaca untuk membuka dunia ini!")}
function explore(){$("#screen").innerHTML=shell("PENGEMBARAAN: SYLLABLE TOWN",`<p class="sub">Cari papan tanda dan bantu penduduk menyusun perkataan.</p><div class="game-stage"><div class="playground" id="playground"><div class="player" id="player">${mascot(data.character)}</div><div class="obstacle">📦</div><div style="position:absolute;right:5%;top:15px;font-size:40px">🏠</div><div style="position:absolute;left:45%;top:10px;font-size:42px">⭐</div></div><div class="game-controls"><button class="btn" onpointerdown="move(-1)" onpointerup="stopMove()">◀</button><button class="btn" onpointerdown="move(1)" onpointerup="stopMove()">▶</button><button class="btn blue" onclick="jump()">LOMPAT</button><button class="btn green" onclick="go('activities')">MASUK AKTIVITI</button></div></div><p class="small">Komputer: gunakan kekunci A/D atau anak panah. Ruang untuk melompat. Telefon: gunakan butang kawalan.</p>`)}
function move(d){playerX=Math.max(0,Math.min(88,playerX+d*5));let p=$("#player");if(p)p.style.left=playerX+"%"}function stopMove(){}function jump(){let p=$("#player");if(!p)return;p.style.transform="translateY(-65px)";setTimeout(()=>p.style.transform="",350)}
window.addEventListener("keydown",e=>{if(["ArrowRight","d","D"].includes(e.key))move(1);if(["ArrowLeft","a","A"].includes(e.key))move(-1);if(e.code==="Space")jump()});
const activitiesList=[["🚂","Kereta Api Suku Kata","train"],["🎣","Memancing Perkataan","fish"],["🎈","Belon Membaca","balloon"],["🖼️","Padanan Gambar","match"],["🃏","Permainan Memori","memory"],["🎡","Roda Perkataan","wheel"],["🧩","Membina Perkataan","build"],["🪰","Menangkap Perkataan","catch"],["📖","Membina Ayat Mudah","sentence"],["🧩","Puzzle Suku Kata","puzzle"],["🔐","Misi Rahsia KV+KV","secret"],["🔊","Nota Audio Sebutan","audio"],["❓","Kuiz Automatik","quiz"]];
function activities(){$("#screen").innerHTML=shell("JOM BACA! — PUSAT AKTIVITI",`<p class="sub">Pilih aktiviti untuk mengumpul bintang dan membuka dunia baharu.</p><div class="note" style="margin-bottom:16px">📚 <b>Bank perkataan diperluas:</b> 85 perkataan KV+KV. Setiap pusingan memilih 10 perkataan secara rawak supaya latihan lebih pelbagai.</div><div class="cards">${activitiesList.map(a=>`<div class="card"><div style="font-size:48px">${a[0]}</div><h3>${a[1]}</h3><button class="btn blue" onclick="startGame('${a[2]}')">Main sekarang</button></div>`).join("")}</div>`)}
let roundWords=[];
function shuffleList(list){return [...list].sort(()=>Math.random()-.5)}
function pickWordOptions(target,field,count=3){
 const key=target[field];
 const distractors=shuffleList([...new Set(words.filter(w=>w!==target&&w[field]!==key).map(w=>w[field]))]).slice(0,count);
 return shuffleList([key,...distractors]);
}
function startGame(type){currentGame=type;qIndex=0;correct=0;selected=[];memoryOpen=[];memoryDone=[];roundWords=shuffleList(words).slice(0,10);game()}
function game(){let w=roundWords[qIndex]||words[qIndex%words.length],title=activitiesList.find(a=>a[2]===currentGame)?.[1]||"Aktiviti";let body="";
if(currentGame==="audio"){body=`<div class="note"><h3>Nota sebutan Bahasa Melayu</h3><p>Huruf vokal: A, E, I, O, U</p><p>Suku kata KV: ba, bi, bu, be, bo</p><p>Gabungan dua suku kata terbuka membentuk banyak perkataan. Contoh: ba + ju = baju, bo + la = bola, ja + ri = jari dan sa + pu = sapu.</p><p>Bank latihan permainan ini mengandungi 85 perkataan yang akan dipilih secara rawak.</p></div><div class="choice-grid">${["Huruf vokal","Suku kata KV","Gabungan KV+KV","Sebutan perkataan"].map((x,i)=>`<button class="choice" onclick="speak(['A, E, I, O, U','ba, bi, bu, be, bo','ba tambah ju menjadi baju','baju'][${i}])">${x}<br>🔊</button>`).join("")}</div>`}
else if(currentGame==="train"||currentGame==="fish"||currentGame==="balloon"||currentGame==="build"||currentGame==="puzzle"||currentGame==="secret"){let opts=pickWordOptions(w,0,3);body=`<div class="game-stage" style="text-align:center"><div style="font-size:55px">${currentGame==="train"?"🚂":currentGame==="fish"?"🎣":currentGame==="balloon"?"🎈":currentGame==="secret"?"🔐":"🧩"}</div><h3>Pilih suku kata pertama untuk membentuk:</h3><div style="font-size:42px;font-weight:1000;color:#2477b9">${w[2]}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="answer('${o}','${w[0]}')">${o}</button>`).join("")}</div><p>Suku kata kedua: <b>${w[1]}</b></p></div>`}
else if(currentGame==="match"||currentGame==="quiz"||currentGame==="catch"){let opts=pickWordOptions(w,2,2);body=`<div class="game-stage" style="text-align:center"><div style="font-size:75px">${w[3]}</div><h3>${currentGame==="match"?"Pilih perkataan yang sepadan dengan gambar:":currentGame==="catch"?"Tangkap perkataan yang betul:":"Apakah nama gambar ini?"}</h3><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="answer('${o}','${w[2]}')">${o}</button>`).join("")}</div></div>`}
else if(currentGame==="wheel"){body=`<div style="text-align:center"><div id="wheel" style="font-size:90px;transition:transform 1s">🎡</div><button class="btn blue" onclick="spinWheel()">PUTAR RODA</button><div id="wheelResult" class="note">Tekan putar dan baca perkataan yang muncul.</div></div>`}
else if(currentGame==="memory"){let pairs=shuffleList(words).slice(0,4).map(w=>[w[3],w[2]]);body=`<p>Cari pasangan gambar dan perkataan yang sama.</p><div class="choice-grid">${pairs.concat(pairs).map((p,i)=>`<button class="choice" id="mem${i}" onclick="memoryPick(${i})">❔</button>`).join("")}</div><div class="feedback" id="memFeedback"></div>`;window.memoryPairs=pairs.concat(pairs).sort(()=>Math.random()-.5)}
else if(currentGame==="sentence"){body=`<div class="note"><h3>Susun perkataan menjadi ayat.</h3><p>Pilih perkataan mengikut urutan yang betul.</p><div class="choice-grid">${["Saya","baca","buku"].map(x=>`<button class="choice" onclick="sentencePick('${x}')">${x}</button>`).join("")}</div><div id="sentenceOut" class="feedback">Ayat: </div><button class="btn green" onclick="checkSentence()">Semak ayat</button>`}
$("#screen").innerHTML=shell(title,`<div class="topline"><span class="pill">Soalan ${qIndex+1} / 10</span><span class="pill">Betul: ${correct}</span></div><div class="progress"><span style="width:${qIndex*10}%"></span></div>${body}<div id="feedback" class="feedback"></div><div style="text-align:center"><button class="btn" onclick="nextQuestion()">Seterusnya →</button><button class="btn red" onclick="go('activities')">Keluar aktiviti</button></div>`,"activities")}
function answer(got,want){let f=$("#feedback");if(!f)return;if(got===want){f.textContent="Betul! Hebat, teruskan membaca! ⭐";f.style.color="#23864b";correct++;award(1);if(qIndex===0&&data.unlocked<2)data.unlocked=2}else{f.textContent="Cuba lagi. Kamu boleh berjaya!";f.style.color="#bd4439"}save()}
function nextQuestion(){if(qIndex>=9){$("#screen").innerHTML=shell("TAHNIAH!",`<div style="text-align:center"><div style="font-size:75px">🏆🌟</div><h2>Kamu berjaya!</h2><p>Jawapan betul: ${correct} daripada 10.</p><button class="btn green" onclick="go('activities')">Pilih aktiviti lain</button><button class="btn blue" onclick="go('map')">Kembali ke peta</button></div>`);data.done.push(currentGame);save();return}qIndex++;game()}
function speak(t,rate=0.8){if(!("speechSynthesis"in window)){alert("Audio sebutan tidak disokong oleh pelayar ini.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ms-MY";u.rate=rate;speechSynthesis.speak(u)}
function spinWheel(){let w=words[Math.floor(Math.random()*words.length)];$("#wheel").style.transform=`rotate(${720+Math.random()*360}deg)`;setTimeout(()=>{$("#wheelResult").innerHTML=`Perkataan kamu: <b>${w[2]}</b> ${w[3]} <button class="btn" onclick="speak('${w[2]}')">🔊 Dengar</button>`},900)}
let sentence=[];
function sentencePick(w){sentence.push(w);$("#sentenceOut").textContent="Ayat: "+sentence.join(" ")}
function checkSentence(){let f=$("#feedback");if(sentence.join(" ")==="Saya baca buku"){f.textContent="Betul! Kamu berjaya membina ayat.";award(2)}else f.textContent="Cuba susun semula perkataan.";sentence=[]}
function memoryPick(i){if(memoryOpen.includes(i)||memoryDone.includes(i))return;memoryOpen.push(i);let p=window.memoryPairs[i];$("#mem"+i).textContent=p[0]+" "+p[1];if(memoryOpen.length===2){let [a,b]=memoryOpen;if(window.memoryPairs[a][1]===window.memoryPairs[b][1]){memoryDone.push(a,b);$("#memFeedback").textContent="Pasangan betul!";award(1)}else setTimeout(()=>{[a,b].forEach(k=>$("#mem"+k).textContent="❔");},700);memoryOpen=[]}}
function profile(){$("#screen").innerHTML=shell("PROFIL PEMAIN",`<div class="cards"><div class="card">${mascot(data.character)}<h3>${data.name}</h3><p>Tahap ${data.level}</p><p>XP: ${data.xp}</p></div><div class="card"><h3>⭐ ${data.stars}</h3><p>Bintang</p><h3>🍌 ${data.coins}</h3><p>Syiling</p><h3>🏅 ${data.done.length}</h3><p>Aktiviti dimainkan</p></div></div><div class="note"><label>Nama panggilan pemain</label><br><input id="playerName" value="${data.name}" maxlength="24"><button class="btn green" onclick="data.name=$('#playerName').value.trim()||'Pengembara Cilik';save();profile()">Simpan nama</button></div>`)}
function collection(){$("#screen").innerHTML=shell("KOLEKSI PEMAIN",`<div class="cards">${["⭐ Bintang pengembaraan","🍌 Pisang emas","📘 Buku ajaib","🗝️ Kunci rahsia","🏅 Lencana pembaca","🎒 Beg pengembara"].map(x=>`<div class="card"><h3>${x}</h3><p class="small">Koleksi pengembaraan</p></div>`).join("")}</div>`)}

function startWorldCanvas(){
 const canvas=$("#worldCanvas");if(!canvas)return;
 const ctx=canvas.getContext("2d"),w=adventureWorlds[adv.world];
 function rounded(x,y,ww,hh,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fill()}
 function draw(){
  if(!document.getElementById("worldCanvas"))return;
  const cw=canvas.width,ch=canvas.height;
  ctx.clearRect(0,0,cw,ch);
  let sky=ctx.createLinearGradient(0,0,0,ch);sky.addColorStop(0,w.sky);sky.addColorStop(1,"#e4f6e9");ctx.fillStyle=sky;ctx.fillRect(0,0,cw,ch);
  // awan dan bukit berlapis
  ctx.fillStyle="#ffffffaa";for(let i=0;i<5;i++){let x=((i*225-adv.frame*.15)%1100+1100)%1100-60;ctx.beginPath();ctx.arc(x,75+(i%2)*35,28,0,7);ctx.arc(x+30,68+(i%2)*35,35,0,7);ctx.arc(x+65,78+(i%2)*35,25,0,7);ctx.fill()}
  ctx.fillStyle="#8ecb91";ctx.beginPath();ctx.moveTo(0,310);ctx.quadraticCurveTo(180,220,360,310);ctx.quadraticCurveTo(560,220,760,310);ctx.quadraticCurveTo(860,250,960,300);ctx.lineTo(960,500);ctx.lineTo(0,500);ctx.fill();
  ctx.fillStyle=w.ground;ctx.fillRect(0,340,cw,160);
  // laluan batu
  ctx.fillStyle="#d8c59a";ctx.beginPath();ctx.moveTo(0,390);ctx.quadraticCurveTo(400,335,960,410);ctx.lineTo(960,500);ctx.lineTo(0,500);ctx.fill();
  for(let i=0;i<15;i++){rounded(i*75-adv.frame*.25%75,420+(i%3)*14,48,12,6,"#f2e2bd")}
  // pokok hiasan
  for(let i=0;i<8;i++){let x=i*140+35;ctx.fillStyle="#805638";ctx.fillRect(x,260,15,100);ctx.fillStyle=["#398d61","#4ca66d","#70b96b"][i%3];ctx.beginPath();ctx.arc(x+7,250,43,0,7);ctx.fill();ctx.beginPath();ctx.arc(x-12,270,28,0,7);ctx.fill()}
  // pondok dan papan tanda
  rounded(725,225,130,112,12,"#e9a95c");ctx.fillStyle="#9a5c38";ctx.beginPath();ctx.moveTo(705,230);ctx.lineTo(790,165);ctx.lineTo(875,230);ctx.fill();rounded(775,275,35,62,6,"#865337");
  rounded(35,250,180,55,12,"#fff0bd");ctx.fillStyle="#75451e";ctx.font="bold 22px Trebuchet MS";ctx.fillText("KAWASAN MISTERI",47,284);
  // NPC
  drawPerson(adv.npc.x,adv.npc.y,"#e98eb1",false);
  // collectible items
  adv.items.forEach(it=>{if(!it.got){ctx.font="38px serif";ctx.fillText(it.emoji,it.x,it.y+Math.sin(adv.frame/12+it.x)*5);}});
  // avatar
  drawPerson(adv.x,adv.y,characterData[data.character].shirt,true);
  // label
  rounded(15,15,230,42,12,"#ffffffdf");ctx.fillStyle="#244d68";ctx.font="bold 18px Trebuchet MS";ctx.fillText(w.name,29,43);
  ctx.font="16px Trebuchet MS";ctx.fillText("Cari objek dan bantu penjaga!",cw-315,43);
  adv.frame++;
  if(adv.keys.left){adv.x=Math.max(38,adv.x-3.2);adv.dir=-1}
  if(adv.keys.right){adv.x=Math.min(920,adv.x+3.2);adv.dir=1}
  if(adv.jump>0){adv.jump+=.12;if(adv.jump>Math.PI)adv.jump=0}
  // collect near
  adv.items.forEach(it=>{if(!it.got&&Math.hypot(adv.x-it.x,adv.y-it.y)<58){it.got=true;data.inventory.push(it.name);award(1);notify("Objek dikumpulkan: "+it.name+"!");if(adv.items.filter(x=>x.got).length>=2){data.missions.collect=true;updateQuest();if(data.unlocked<2)data.unlocked=2;}save();}});
  requestAnimationFrame(draw);
 }
 function drawPerson(x,y,color,isPlayer){
  let jumpY=isPlayer&&adv.jump>0?Math.sin(adv.jump)*75:0;
  ctx.save();ctx.translate(x,y-jumpY);if(isPlayer&&adv.dir<0)ctx.scale(-1,1);
  ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(0,37,27,8,0,0,7);ctx.fill();
  ctx.fillStyle="#f1c28c";ctx.beginPath();ctx.arc(0,-5,24,0,7);ctx.fill();
  ctx.fillStyle=isPlayer?"#5b392b":"#71452f";ctx.beginPath();ctx.arc(0,-15,25,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-8,-5,7,0,7);ctx.arc(8,-5,7,0,7);ctx.fill();ctx.fillStyle="#3d332c";ctx.beginPath();ctx.arc(-7,-4,3,0,7);ctx.arc(9,-4,3,0,7);ctx.fill();
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-22,19,44,36,10);ctx.fill();
  ctx.strokeStyle="#704a32";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-9,50);ctx.lineTo(-12,66);ctx.moveTo(9,50);ctx.lineTo(12,66);ctx.stroke();
  ctx.restore();
 }
 requestAnimationFrame(draw);
}

function bossChallenge(){
 const questions=[
  {q:"Suku kata manakah membentuk perkataan BUKU?",a:["bu + ku","ba + ju","su + su"],ok:0},
  {q:"Pilih gabungan yang membentuk MATA.",a:["ma + ta","ba + ju","su + su"],ok:0},
  {q:"Perkataan SUSU terdiri daripada...",a:["su + su","sa + si","si + su"],ok:0}
 ];
 let n=0,score=0;
 function render(){
  if(n>=questions.length){
   const passed=score>=2;
   if(passed){award(4);data.missions.read=true;data.unlocked=Math.max(data.unlocked,Math.min(10,(data.currentWorld||0)+2));save();}
   $("#screen").innerHTML=shell("KEPUTUSAN CABARAN PENJAGA",`<div class="boss-card"><div style="font-size:65px">${passed?"🏆":"🌱"}</div><h2>${passed?"Cabaran berjaya!":"Teruskan berlatih!"}</h2><p>Jawapan betul: ${score} daripada 3.</p><p>${passed?"Penjaga memberikan 4 bintang dan membuka laluan baharu.":"Kamu boleh cuba lagi. Setiap latihan membantu kamu menjadi lebih mahir."}</p><button class="btn blue" onclick="explore()">Kembali ke dunia</button><button class="btn green" onclick="bossChallenge()">Cuba sekali lagi</button></div>`);
   return;
  }
  const q=questions[n];
  $("#screen").innerHTML=shell("CABARAN PENJAGA",`<div class="boss-card"><div style="font-size:55px">🦉</div><h2>Ujian Suku Kata</h2><p>Soalan ${n+1} daripada 3</p><h3>${q.q}</h3>${q.a.map((a,i)=>`<button class="boss-choice" onclick="answerBoss(${i})">${a}</button>`).join("")}<p id="bossFeedback" aria-live="polite"></p></div>`);
 }
 window.answerBoss=function(i){
  const q=questions[n];
  if(i===q.ok){score++;document.getElementById("bossFeedback").textContent="Betul! Bagus sekali.";speak("Betul. Bagus sekali.");}
  else {document.getElementById("bossFeedback").textContent="Belum tepat. Cuba ingat bunyi suku kata.";speak("Belum tepat. Cuba lagi.");}
  n++;setTimeout(render,650);
 };
 render();
}

function characters(){
 $("#screen").innerHTML=shell("PILIH WATAK KAMU",`<p class="sub">Pilih rakan pengembaraan yang akan menemani kamu.</p>
 <div class="cards">${characterData.map((c,i)=>`<div class="character-card">${mascot(i)}<h3>${c.name}</h3><span class="role-tag">${c.role}</span><p class="small">${c.desc}</p><button class="btn ${data.character===i?'green':'blue'}" onclick="data.character=${i};save();characters()">${data.character===i?'✓ Dipilih':'Pilih watak'}</button></div>`).join("")}</div>
 <div style="text-align:center;margin-top:20px"><button class="btn green" onclick="go('map')">Teruskan pengembaraan →</button></div>`);
}
function map(){
 $("#screen").innerHTML=shell("PETA DUNIA",`<p class="sub">Teroka pulau ajaib dan buka kawasan baharu dengan menyelesaikan misi membaca.</p>
 <div class="map-board"><div class="world-grid">${worlds.map((w,i)=>`<button class="world ${i>=data.unlocked?'locked':''}" onclick="${i<data.unlocked?`go('explore')`:`lockedWorld()`}"><div style="font-size:35px">${w[0]}</div><strong>${w[1]}</strong><div class="small">${i<data.unlocked?'✦ Boleh diterokai':'🔒 Belum dibuka'}</div></button>`).join("")}</div></div>
 <div class="note" style="margin-top:16px">⭐ Bintang terkumpul: ${data.stars} &nbsp; · &nbsp; Misi selesai: ${data.done.length}</div>`);
}
function activities(){
 $("#screen").innerHTML=shell("PUSAT AKTIVITI JOM BACA!",`<p class="sub">Pilih permainan kegemaran dan kumpulkan bintang sambil belajar.</p>
 <div class="note" style="margin-bottom:16px">📚 <b>Bank perkataan diperluas:</b> 85 perkataan KV+KV. Contoh: baju, batu, bola, budi, cari, cuci, gigi, gula, jari, jaga, kaki, lagu, lari, madu, nasi, naga, padi, paku, raja, roda, rusa, satu, sate, sapu, tali, tisu, tiga dan topi. Setiap pusingan memilih 10 perkataan secara rawak supaya latihan tidak berulang dengan set yang sama.</div>
 <div class="cards">${activitiesList.map((a,i)=>`<div class="activity-card"><div class="activity-art">${a[0]}</div><h3>${a[1]}</h3><button class="btn blue" onclick="startGame('${a[2]}')">Mula bermain ↗</button></div>`).join("")}</div>`);
}
